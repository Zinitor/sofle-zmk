# Uncomment the following line to enable the Sofle OLED Display
# CONFIG_ZMK_DISPLAY=y
# CONFIG_ZMK_WIDGET_LAYER_STATUS=y
# CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
# CONFIG_ZMK_WIDGET_WPM_STATUS=y 

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment this line below to add rgb underglow / backlight support
# CONFIG_ZMK_RGB_UNDERGLOW=y
# Also uncomment this one if you enable the underglow, since upstream ZMK's
# Sofle shield no longer enables the WS2812 driver for you:
# CONFIG_WS2812_STRIP=y

CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_SLEEP=n

CONFIG_BT_MAX_CONN=4
# Pairing without a passkey. The experimental security features imply a
# passkey-entry requirement (MITM), which makes the host show a code and the
# keyboard type it back over SMP. That only works with a host agent that can
# display a passkey, and it was blocking pairing on this host. Keep the
# connection-stability tweaks from EXPERIMENTAL_FEATURES, but pair "Just Works".
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_PHY_2M=n
